global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:8080]
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: [llm:8000]
  - job_name: embedding
    metrics_path: /metrics
    static_configs:
      - targets: [embedding:9000]
  - job_name: gpu
    metrics_path: /metrics
    static_configs:
      - targets: [dcgm-exporter:9400]
